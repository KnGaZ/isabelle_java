# =============================================================
#  Isabella Bacalar — configuracion base (Fase 1)
# =============================================================

spring.application.name=isabella

# ---- Base de datos MySQL ------------------------------------
# Crear antes la base y el usuario (ver README, seccion "Preparar MySQL").
# NO reutilizar la base 'sail'. Aqui va una base nueva: 'isabella'.
spring.datasource.url=jdbc:mysql://localhost:3306/isabella?useSSL=false&serverTimezone=America/Cancun&characterEncoding=utf8mb4&allowPublicKeyRetrieval=true
spring.datasource.username=isabella
spring.datasource.password=CAMBIA_ESTA_CLAVE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=isabella-pool

# ---- JPA / Hibernate ----------------------------------------
# El esquema lo gobierna schema.sql (NO dejar que Hibernate lo genere).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Inicializacion de esquema/seed -------------------------
# Por seguridad (esto es la caja del hotel) el schema.sql y seed.sql se
# ejecutan A MANO la primera vez (ver README). Por eso se deja en 'never'.
# Para un entorno de desarrollo desechable puedes ponerlo en 'always'.
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/seed.sql

# ---- Thymeleaf ----------------------------------------------
spring.thymeleaf.cache=false

# ---- Otros --------------------------------------------------
# Formato de decimales/fechas y zona horaria de Bacalar (Quintana Roo).
spring.jackson.time-zone=America/Cancun
