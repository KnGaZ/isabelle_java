<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title layout:title-pattern="$CONTENT_TITLE · Isabella Bacalar">Isabella Bacalar</title>

  <!-- Tipografias (seccion 3): Bricolage Grotesque 800, Instrument Sans, Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet"/>

  <link rel="stylesheet" th:href="@{/css/isabella.css}"/>
  <!-- Punto de extension para CSS/JS por pagina -->
  <th:block layout:fragment="head"></th:block>
</head>

<body>
<div class="app" th:classappend="${wide} ? 'app--wide' : (${xwide} ? 'app--xwide' : '')">

  <!-- ===================== HEADER ===================== -->
  <header class="topbar">
    <a class="brand" th:href="@{/}" style="text-decoration:none">
      <span class="brand-logo">I</span>
      <span class="brand-name">Isabella <span class="accent">Bacalar</span></span>
    </a>
    <span class="user-chip" th:if="${userName != null}">
      <span class="dot"></span>
      <span th:text="${userName}">Vane</span>
    </span>
    <a class="link-salir" th:href="@{/salir}">Salir</a>
  </header>

  <!-- ===================== CONTENIDO ===================== -->
  <main>
    <div layout:fragment="content">
      <p>Contenido</p>
    </div>
  </main>

  <!-- ===================== BOTTOM NAV (filtrado por rol) ===================== -->
  <nav class="bottomnav" th:with="rol=${userRole}">

    <!-- Captura -> ADMIN, GERENCIA, RECEPCION -->
    <a class="nav-item" th:href="@{/captura}"
       th:classappend="${active == 'captura'} ? 'active'"
       th:if="${rol == 'ADMIN' or rol == 'GERENCIA' or rol == 'RECEPCION'}">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Captura</span>
    </a>

    <!-- Dashboard -> ADMIN, GERENCIA, SOCIO, RECEPCION -->
    <a class="nav-item" th:href="@{/}"
       th:classappend="${active == 'dashboard'} ? 'active'"
       th:if="${rol == 'ADMIN' or rol == 'GERENCIA' or rol == 'SOCIO' or rol == 'RECEPCION'}">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Dashboard</span>
    </a>

    <!-- Reservas -> ADMIN, GERENCIA, RECEPCION -->
    <a class="nav-item" th:href="@{/reservas}"
       th:classappend="${active == 'reservas'} ? 'active'"
       th:if="${rol == 'ADMIN' or rol == 'GERENCIA' or rol == 'RECEPCION'}">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Reservas</span>
    </a>

    <!-- Gastos -> ADMIN, GERENCIA, RECEPCION -->
    <a class="nav-item" th:href="@{/gastos}"
       th:classappend="${active == 'gastos'} ? 'active'"
       th:if="${rol == 'ADMIN' or rol == 'GERENCIA' or rol == 'RECEPCION'}">
      <svg viewBox="0 0 24 24"><path d="M4 3h16v18l-3-2-3 2-3-2-3 2zM8 8h8M8 12h8"/></svg>
      <span>Gastos</span>
    </a>

    <!-- Socios -> ADMIN, GERENCIA, SOCIO -->
    <a class="nav-item" th:href="@{/socios}"
       th:classappend="${active == 'socios'} ? 'active'"
       th:if="${rol == 'ADMIN' or rol == 'GERENCIA' or rol == 'SOCIO'}">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
      <span>Socios</span>
    </a>

    <!-- Admin -> solo ADMIN -->
    <a class="nav-item" th:href="@{/admin}"
       th:classappend="${active == 'admin'} ? 'active'"
       th:if="${rol == 'ADMIN'}">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H2a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 3.6 8a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 8 3.6 1.65 1.65 0 0 0 9 2.09V2a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 16 3.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 20.4 8c.14.35.22.73.22 1.11"/></svg>
      <span>Admin</span>
    </a>
  </nav>

  <!-- Toast opcional: cualquier pagina puede setear ${toast} -->
  <div class="toast" th:if="${toast != null}" th:text="${toast}"></div>
</div>
</body>
</html>
